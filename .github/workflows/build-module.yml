name: 构建独立模块

on:
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.module.outputs.version }}
      commit_count:
        value: ${{ jobs.module.outputs.commit_count }}
      module_name:
        value: ${{ jobs.module.outputs.module_name }}

permissions:
  contents: read

jobs:
  module:
    name: 验证并构建模块内容
    runs-on: ubuntu-latest
    timeout-minutes: 55
    outputs:
      version: ${{ steps.pack.outputs.version }}
      commit_count: ${{ steps.pack.outputs.commit_count }}
      module_name: ${{ steps.pack.outputs.module_name }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: 构建并压缩模块内容
        id: pack
        uses: ./.github/actions/build-module

      - name: 保存已验证的模块内容
        uses: actions/upload-artifact@v7
        with:
          name: module-package
          path: ${{ steps.pack.outputs.module_name }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true
