name: 发布（Release）

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: 验证发布版本与更新日志
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 拉取发布元数据
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            docs
            src/module/module.prop

      - name: 配置发布脚本 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 检查 tag、模块版本与更新日志
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_TYPE" = tag || {
            echo '发布工作流只能从已有的 v<版本号> tag 运行。' >&2
            exit 1
          }
          node .github/scripts/release-preflight.mjs \
            src/module/module.prop docs/changelog.md "$TAG"

  build:
    name: 并行构建模块与管理器
    needs: preflight
    uses: ./.github/workflows/build-module.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  release:
    name: 发布 Release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ needs.build.outputs.version }}
      COMMIT_COUNT: ${{ needs.build.outputs.commit_count }}
      MODULE_NAME: ${{ needs.build.outputs.module_name }}
    steps:
      - name: 拉取发布脚本与更新日志
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            docs
            .github/kernelsu

      - name: 配置发布脚本 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 下载本次运行的完整模块包
        uses: actions/download-artifact@v8
        with:
          name: module-package

      - name: 校验模块包与发布身份
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/prepare-kernelsu.mjs check "$TAG" "$MODULE_NAME" "$COMMIT_COUNT"

      - name: 生成模块自更新清单
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          jq -n \
            --arg version "Module ${TAG}" \
            --argjson versionCode "${COMMIT_COUNT}" \
            --arg zipUrl "https://github.com/${REPO}/releases/download/${TAG}/${MODULE_NAME}" \
            --arg changelog "https://raw.githubusercontent.com/${REPO}/refs/heads/main/docs/changelog.md" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' \
            > update.json
          cat update.json

      - name: 提取当前版本更新日志
        run: |
          node .github/scripts/extract-release-notes.mjs \
            docs/changelog.md \
            "$VERSION" \
            "$RUNNER_TEMP/release-notes.md"

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ env.MODULE_NAME }}
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
