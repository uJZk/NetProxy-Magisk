# NetProxy 模块设置
# 开机自动启动服务 (1=启用, 0=禁用)
AUTO_START=0
# 出站模式 (rule=规则分流, global=全局代理, direct=全局直连, AllowAds=允许广告)
OUTBOUND_MODE=rule
# 节点选择模式 (manual=手动选择, urltest=动态测速)
SELECTOR_MODE=urltest
# 当前活动节点组
ACTIVE_GROUP_ID="default"
# 手动选择的节点引用，格式为 <group-id>/<tag>；自动模式必须留空
SELECTED_NODE_REF=""

#######################################
# WiFi 自动切换出站模式
#######################################
# 按当前连接的 WiFi SSID 在基础模式与 Direct 间自动切换
WIFI_AUTO_SWITCH=0
# blacklist=名单内使用 Direct，whitelist=仅名单内使用基础模式
WIFI_SSID_MODE="blacklist"
# SSID 名单，英文逗号分隔
WIFI_SSID_LIST=""
# 非 WiFi 网络是否使用基础模式 (0=Direct，1=基础模式)
PROXY_ON_CELLULAR=1

#######################################
# 完整配置直通
#######################################
# 配置来源 (managed=模块生成配置, raw=直接运行下载的完整 sing-box 配置)
CONFIG_MODE=managed
# 完整配置下载地址，raw 模式必填
RAW_CONFIG_URL=""
# 下载 User-Agent，留空使用默认值
RAW_CONFIG_USER_AGENT=""
# 自动更新周期（秒），0 表示只手动更新
RAW_CONFIG_INTERVAL=86400
